apiVersion: v1
kind: Namespace
metadata:
  name: shipfast
  labels:
    app.kubernetes.io/part-of: shipfast
    # Pod Security Admission: reject any pod in this namespace that is not
    # non-root, capability-free and seccomp-confined.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
