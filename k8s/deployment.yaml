apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipfast-status
  namespace: shipfast
  labels:
    app.kubernetes.io/name: shipfast-status
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: shipfast
spec:
  replicas: 2
  revisionHistoryLimit: 5
  # Selector is immutable after creation - keep it to the one stable label.
  selector:
    matchLabels:
      app.kubernetes.io/name: shipfast-status
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # never drop below 2 ready pods during a rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipfast-status
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: shipfast
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shipfast-status
          # Updated by CI on each release. Change versions via git, never kubectl.
          image: kkzoo/shipfast-status:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: APP_NAME
              value: "shipfast-status"
            - name: APP_ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # Writable scratch space for gunicorn; the rest of the filesystem is read-only.
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
